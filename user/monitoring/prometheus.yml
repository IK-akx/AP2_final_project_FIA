global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - name: user-service
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:50053']  # gRPC сервер
        labels:
          service: 'user-service'
          environment: 'development'

  - name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']