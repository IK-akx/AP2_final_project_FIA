services:
  # === Order Service Infrastructure ===
  postgres-order:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-order:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "6381:6379"
    volumes:
      - order-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js"
    healthcheck:
      test: ["CMD", "nats", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === Order Service ===
  order-service:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "50052:50052"
      - "9102:9102"
    environment:
      DB_HOST: postgres-order
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order_db
      DB_SSLMODE: disable
      REDIS_HOST: redis-order
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      NATS_URL: nats://nats:4222
      GRPC_PORT: "50052"
      PRODUCT_SERVICE_ADDR: product-service:50051
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      PROMETHEUS_PORT: "9102"
      LOG_LEVEL: info
    depends_on:
      postgres-order:
        condition: service_healthy
      redis-order:
        condition: service_healthy
      nats:
        condition: service_healthy

  # === Observability (Bonus) ===
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  order-pgdata:
  order-redisdata: